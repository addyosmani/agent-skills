  reviewer-readonly:
    description: >-
      Reviewer that "hardened" itself by denying bare Bash wholesale - exactly
      the trap D9-amendment(c) warns against.
    envelope:
      deny:
        - Edit
        - Write
        - Bash
        - Bash(git commit*)
        - PowerShell(git commit*)
        - Bash(git push*)
        - PowerShell(git push*)
        - Bash(git apply*)
        - PowerShell(git apply*)
        - Bash(git stash*)
        - PowerShell(git stash*)
        - Bash(git merge*)
        - PowerShell(git merge*)
      ask: []
      allow: []
  shaping-agent:
