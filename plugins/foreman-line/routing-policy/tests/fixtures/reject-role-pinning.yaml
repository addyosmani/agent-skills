# Rejecting fixture (AC5b): coordinator resolves to a non-frontier tier.
# Schema-valid (coordinator is just a non-empty string) but violates D4's
# structural pin of coordinator/verifier to the frontier tier.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    eligible_models: [claude-haiku-4-5, claude-sonnet-5, claude-opus-4-8]
  internal:
    eligible_models: [claude-haiku-4-5, claude-sonnet-5, claude-opus-4-8]
  restricted:
    eligible_models: [claude-haiku-4-5, claude-sonnet-5, claude-opus-4-8]

roles:
  coordinator: standard
  verifier: frontier
  builder: per-class

model_tiers:
  frontier: [claude-opus-4-8]
  standard: [claude-sonnet-5]
  economy: [claude-haiku-4-5]
