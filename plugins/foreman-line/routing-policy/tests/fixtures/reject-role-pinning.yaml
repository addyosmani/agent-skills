# Rejecting fixture (AC5b): coordinator resolves to a non-frontier tier.
# Schema-valid (coordinator is just a non-empty string) but violates D4's
# structural pin of coordinator/verifier to the frontier tier.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    transport_requirements: { data_collection: allow, zdr: false }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  internal:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  restricted:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]

roles:
  coordinator: standard
  verifier: frontier
  builder: per-class

model_tiers:
  frontier: [anthropic/claude-opus-5]
  standard: [anthropic/claude-sonnet-5]
  economy: [anthropic/claude-haiku-4.5]

shadow_routes: {}
