# Rejecting fixture (AC5e / rework Finding 1): `anthropic/claude-haiku-4.5` is smuggled
# into `model_tiers.frontier` alongside the legitimate `anthropic/claude-opus-5`.
# Every OTHER invariant (a-d) and the schema are satisfied unchanged from the
# shipped policy, so this fixture isolates invariant (e) alone: tier *names*
# still check out (roles pinned to 'frontier', allowlists reference 'frontier'
# by name), but the registry backing what 'frontier' actually resolves to has
# been quietly widened - exactly the gutting Finding 1 identified.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    transport_requirements: { data_collection: allow, zdr: false }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  internal:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  restricted:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]

roles:
  coordinator: frontier
  verifier: frontier
  builder: per-class

model_tiers:
  frontier: [anthropic/claude-opus-5, anthropic/claude-haiku-4.5]
  standard: [anthropic/claude-sonnet-5]
  economy: [anthropic/claude-haiku-4.5]

shadow_routes: {}
