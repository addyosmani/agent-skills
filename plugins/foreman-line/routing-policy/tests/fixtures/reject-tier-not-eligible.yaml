# Rejecting fixture (invariant f): `openai/gpt-5.6-sol` is a legitimate frontier id
# (it IS in KNOWN_FRONTIER_MODELS) and is listed in `model_tiers.frontier`,
# but was never added to any `data_classification.*.eligible_models` list.
# Every other invariant (a-e) and the schema are satisfied unchanged from the
# shipped policy, so this fixture isolates (f) alone: classification gating
# runs before cost optimization (D6), so this model can never be dispatched
# under any classification - the tier list is advertising a route that does
# not exist.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    transport_requirements: { data_collection: allow, zdr: false }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  internal:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  restricted:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]

roles:
  coordinator: frontier
  verifier: frontier
  builder: per-class

model_tiers:
  frontier: [anthropic/claude-opus-5, openai/gpt-5.6-sol]
  standard: [anthropic/claude-sonnet-5]
  economy: [anthropic/claude-haiku-4.5]

shadow_routes: {}
