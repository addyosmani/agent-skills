# Rejecting fixture (AC5d): `boilerplate.ceiling_usd` is present but zero.
# Enforced structurally (`exclusiveMinimum: 0`) — a technically-present but
# non-positive ceiling is not a valid ceiling.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    eligible_models: [claude-haiku-4-5, claude-sonnet-5, claude-opus-4-8]
  internal:
    eligible_models: [claude-haiku-4-5, claude-sonnet-5, claude-opus-4-8]
  restricted:
    eligible_models: [claude-haiku-4-5, claude-sonnet-5, claude-opus-4-8]

roles:
  coordinator: frontier
  verifier: frontier
  builder: per-class

model_tiers:
  frontier: [claude-opus-4-8]
  standard: [claude-sonnet-5]
  economy: [claude-haiku-4-5]

shadow_routes:
  cerebras-shadow:
    adapter_id: cerebras-shadow
    data_classification: public
    allowed_task_types: [spec_lint, evidence_index, review_triage]
    requires_live_discovery: true
    candidate_only: true
    authority: none
    tools_granted: []
    effect_capability: none
    prohibited_roles: [coordinator, verifier]
