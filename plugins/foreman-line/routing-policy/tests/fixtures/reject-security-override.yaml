# Rejecting fixture (AC5c): a class self-declares `security_flavored: true`
# but its allowlist still contains a non-frontier tier ('standard'). The
# override requires EVERY allowlisted tier to equal 'frontier', not merely
# to contain it — this closes the mixed-allowlist loophole.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00
  security-audit:
    allowlist: [standard, frontier]
    ceiling_usd: 25.00
    security_flavored: true

data_classification:
  public:
    transport_requirements: { data_collection: allow, zdr: false }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  internal:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]
  restricted:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5, anthropic/claude-opus-5]

roles:
  coordinator: frontier
  verifier: frontier
  builder: per-class

model_tiers:
  frontier: [anthropic/claude-opus-5]
  standard: [anthropic/claude-sonnet-5]
  economy: [anthropic/claude-haiku-4.5]

shadow_routes: {}
