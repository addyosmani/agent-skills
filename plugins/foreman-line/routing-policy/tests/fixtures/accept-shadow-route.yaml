# Accepting fixture: the shipped v0.3 policy plus one fully-contained shadow
# route. The shipped policy declares no shadow routes; this fixture is the
# canonical example of a valid one and is what the shadow-route containment
# tests (here and in dispatch/tests/shadow-routing.test.ts) load. The route
# key is deliberately provider-neutral — the schema no longer requires any
# particular adapter name.
classes:
  boilerplate:
    allowlist: [economy]
    ceiling_usd: 0.50
  standard-feature:
    allowlist: [standard]
    ceiling_usd: 5.00
  architecture/risk:
    allowlist: [frontier]
    ceiling_usd: 25.00
  implementation/standard:
    allowlist: [standard]
    ceiling_usd: 5.00

data_classification:
  public:
    transport_requirements: { data_collection: allow, zdr: false }
    eligible_models: &all_models
      - anthropic/claude-opus-5
      - anthropic/claude-fable-5.1
      - openai/gpt-5.6-sol
      - google/gemini-3.1-pro-preview
      - anthropic/claude-sonnet-5
      - google/gemini-3.8-flash
      - openai/gpt-5.6-terra
      - openai/gpt-5.6-luna
      - google/gemini-3.1-flash-lite
      - anthropic/claude-haiku-4.5
  internal:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: *all_models
  restricted:
    transport_requirements: { data_collection: deny, zdr: true }
    eligible_models: *all_models

roles:
  coordinator: frontier
  verifier: frontier
  builder: per-class

model_tiers:
  frontier:
    - anthropic/claude-opus-5
    - openai/gpt-5.6-sol
    - google/gemini-3.1-pro-preview
    - anthropic/claude-fable-5.1
  standard: [anthropic/claude-sonnet-5, google/gemini-3.8-flash, openai/gpt-5.6-terra]
  economy: [openai/gpt-5.6-luna, google/gemini-3.1-flash-lite, anthropic/claude-haiku-4.5]

shadow_routes:
  example-shadow:
    adapter_id: example-shadow
    data_classification: public
    allowed_task_types: [spec_lint, evidence_index, review_triage]
    requires_live_discovery: true
    candidate_only: true
    authority: none
    tools_granted: []
    effect_capability: none
    prohibited_roles: [coordinator, verifier]
