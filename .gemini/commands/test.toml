description = "Write tests and implement test-first — use RED-GREEN-REFACTOR or the Prove-It bug-fix pattern"

prompt = """
Invoke the test-driven-development skill.

If the request is only to execute or summarize existing tests, invoke the tests skill instead and stop this implementation workflow. Do not edit code for a run-only request.

Before writing tests:
0. If a READY Test Planner is supplied, validate and consume it without silently changing its cases, layer, or oracle.
1. For a non-trivial change or uncertain coverage, invoke the test-case-design skill to produce the Test Planner. The test-engineer persona may review it once when available.
2. For one obvious behavior or a confirmed defect, use the TDD skill's mini planner instead of expanding the design phase.

For new features:
1. Select the highest-priority READY case from the Test Planner
2. Write the test that describes the expected behavior (it should FAIL)
3. Implement the code to make it pass
4. Refactor while keeping tests green

For bug fixes (Prove-It pattern):
1. Select the READY regression case and write a test that reproduces the bug (must FAIL)
2. Confirm the test fails
3. Implement the fix
4. Confirm the test passes
5. Run the affected suites and project-required regression gates using discovered commands

For browser-related issues, also invoke browser-testing-with-devtools to verify with Chrome DevTools MCP.
"""
