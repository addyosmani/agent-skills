name: Lint Agent Skills

on:
  pull_request:
    paths:
      - 'skills/**'

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Skill Anatomy
        run: node scripts/validate-skill-structure.js
